name: Repackage existing TeXstudio Espresso release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release whose tested code is retained
        type: string
        default: 4.9.9-espresso-1
permissions:
  contents: read
concurrency:
  group: product-release
  cancel-in-progress: false
jobs:
  macos:
    name: Package signed DMG (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, x86_64]
    runs-on: ${{ matrix.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'dmgbuild==1.6.7'
      - name: Verify tooling contracts
        run: python3 -m unittest discover -s native/tests
      - name: Download and verify the original accepted Mac app
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 native/scripts/repackage_release.py download --tag "$RELEASE_TAG" \
            --target macos-${{ matrix.architecture }} --output original
          python3 native/scripts/repackage_release.py macos-icon \
            --archive "original/texstudio-espresso-$RELEASE_TAG-macos-${{ matrix.architecture }}.zip" \
            --output staged --packaging-revision "$GITHUB_SHA"
      - name: Sign and notarize the app and drag-to-Applications disk image
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          python3 native/scripts/notarize_app.py --app 'staged/TeXstudio Espresso.app' \
            --output "dist/texstudio-espresso-$RELEASE_TAG-macos-${{ matrix.architecture }}.dmg" \
            --reports notarization --timeout 25m
      - uses: actions/upload-artifact@v7
        with:
          name: repackaged-macos-${{ matrix.architecture }}
          path: dist/*.dmg*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repackage-diagnostics-${{ matrix.architecture }}
          path: notarization/
          if-no-files-found: ignore
          retention-days: 7
  assemble:
    needs: macos
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          pattern: repackaged-macos-*
          path: release-inputs/macos
      - name: Verify original sources and assemble the new release layout
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 native/scripts/repackage_release.py download --tag "$RELEASE_TAG" --output release-inputs/original
          source_revision=$(python3 -c 'import json; print(json.load(open("release-inputs/original/release-manifest.json"))["sourceRevision"])')
          python3 native/scripts/assemble_release.py --inputs release-inputs --output release-assets \
            --revision "$source_revision" --packaging-revision "$GITHUB_SHA"
          python3 "release-assets/texstudio-espresso-$RELEASE_TAG-sources.zip" \
            --platform macos-arm64 --output "$RUNNER_TEMP/restored-sources"
          git -C "$RUNNER_TEMP/restored-sources/texstudio" apply --check ../packaging/changes.patch
          rm -rf "$RUNNER_TEMP/restored-sources"
      - name: Save verified replacements for publication
        uses: actions/upload-artifact@v7
        with:
          name: repackaged-release
          path: |
            release-assets/
            release-notes.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
