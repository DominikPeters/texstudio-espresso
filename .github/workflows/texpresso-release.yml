# Keep the manual launcher and reusable implementation at the same revision.
name: Build signed TeXstudio Espresso for macOS
run-name: Signed TeXstudio Espresso macOS (${{ inputs.architecture }})
on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Mac architecture to build
        type: choice
        options: [arm64, x86_64, both]
        default: arm64
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/texpresso-macos.yml
    with:
      architecture: ${{ inputs.architecture }}
    secrets: inherit
